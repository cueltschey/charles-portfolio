<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Force Graph with Detail Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="graph-container" id="graph-container"></div>
  <div id="left-panel"></div>
  <div id="right-panel"></div>

  <script src="https://cdn.jsdelivr.net/npm/force-graph"></script>
  <script>
    const bgCanvas = document.getElementById("bg-canvas");
    const ctx = bgCanvas.getContext("2d");
    let stars = [];
    function resizeCanvas() {
      bgCanvas.width = window.innerWidth;
      bgCanvas.height = window.innerHeight;
      stars = Array.from({length: 200}, () => ({
        x: Math.random() * bgCanvas.width,
        y: Math.random() * bgCanvas.height,
        speed: 0.2 + Math.random() * 1.5,
        radius: Math.random() * 1.5 + 0.5
      }));
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function animateStars() {
      ctx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      ctx.fillStyle = "white";
      for (let star of stars) {
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, 2 * Math.PI);
        ctx.fill();
        star.x += star.speed * 0.5;
        star.y += star.speed * 0.2;

        if (star.x > bgCanvas.width) star.x = 0;
        if (star.y > bgCanvas.height) star.y = 0;
      }
      requestAnimationFrame(animateStars);
    }
    animateStars();

    colorList = {}
    let currentColorIdx = 0;
    let predefinedColors = [
      "#b9375d",
      "#d25d5d",
      "#e7d3d3",
      "#eeeeee",
    ]


    function randomColorHex() {
      //const randomHex = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
      //return randomHex;
      currentColorIdx += 1;
      return predefinedColors[currentColorIdx - 1];
    }

    function nodePaint(node, ctx, index) {
      if(!colorList[node.type]){
        newColor = randomColorHex()
        ctx.fillStyle = newColor
        colorList[node.type] = newColor
      } else {
        ctx.fillStyle = colorList[node.type]
      }

      // Draw the node based on its type
      [
        () => { ctx.fillRect(node.x - 6, node.y - 4, 12, 8); }, // rectangle
        () => { ctx.beginPath(); ctx.moveTo(node.x, node.y - 5); ctx.lineTo(node.x - 5, node.y + 5); ctx.lineTo(node.x + 5, node.y + 5); ctx.fill(); }, // triangle
        () => { ctx.beginPath(); ctx.arc(node.x, node.y, 5, 0, 2 * Math.PI, false); ctx.fill(); }, // circle
        () => { 
          ctx.beginPath(); ctx.arc(node.x, node.y, 5, 0, 2 * Math.PI, false); ctx.fill();
          ctx.font = '5px Sans-Serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(node.name, node.x, node.y + 10); 
        } 
      ][index]();

      if (node === focusedNode) {
        ctx.strokeStyle = 'rgba(120, 200, 255, 0.9)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }


    const data = {
      nodes: [
        { id: 'home', name: 'About Me', type: '1' },
        { id: 'projects', name: 'Personal Projects', type: '2'},
        { id: 'contact', name: 'Contact' , type: '2'},
        { id: 'resume', name: 'Resume' , type: '2'}
      ],
      links: [
        { source: 'home', target: 'projects' },
        { source: 'home', target: 'contact' },
        { source: 'home', target: 'resume' }
      ]
    };

    let focusedNode = data.nodes[0];
    loadNodeDetails(focusedNode.id);

    function focusOnNode(node, Graph) {
      Graph.centerAt(node.x, node.y, 1000);
      focusedNode = node
    }


    function loadNodeDetails(nodePage) {
      const leftPanel = document.getElementById('right-panel');
      fetch(`pages/${nodePage}_right.html`)
        .then(res => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.text();
        })
        .then(html => leftPanel.innerHTML = html)
        .catch(err => {
          leftPanel.innerHTML = `<p style="color: #e63946;">Error loading content: ${err.message}</p>`;
        });

      panel = document.getElementById('left-panel');
      fetch(`pages/${nodePage}_left.html`)
        .then(res => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.text();
        })
        .then(html => panel.innerHTML = html)
        .catch(err => {
          panel.innerHTML = `<p style="color: #e63946;">Error loading content: ${err.message}</p>`;
        });
    }


    const Graph = ForceGraph()(document.getElementById('graph-container'))
      .nodeCanvasObject((node, ctx) => nodePaint(node, ctx, 3))
      .graphData(data)
      .nodeRelSize(12)
      .linkColor(link => {
        if (focusedNode && (link.source === focusedNode || link.target === focusedNode)) {
          return 'rgba(255,255,255,1)';
        }
        return 'rgba(255,255,255,0.4)';
      })
      .onNodeClick(node => {
        loadNodeDetails(node.id);
        focusOnNode(node, Graph)
      });

    Graph.d3Force('charge').strength(-500);
  </script>
</body>
</html>
