<!doctype html> <html lang="en"> <head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Charles Ueltschey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/index.css">
<link rel="stylesheet" href="css/type.css">
<link rel="stylesheet" href="css/projects.css">
<link rel="stylesheet" href="css/orbit.css">
</head>
<body>
<main id="viewport" tabindex="0" aria-label="Full screen sections">
  <section id="s1" aria-label="Section 1">
    <div class="panel">
      <h1 class="typewriter" 
    data-text="Charles Ueltschey"
    data-speed="50" 
    data-cursor="|">
      </h1>
      <p class="subtext" 
    data-speed="75" 
    data-cursor="|">
      </p>
    </div>
		<div class="orbit-ring">
      <img src="assets/lang/python.svg" alt="Python" class="orbit-icon" style="--i:0;">
      <img src="assets/lang/typescript.svg" alt="TypeScript" class="orbit-icon" style="--i:1;">
      <img src="assets/lang/cpp.svg" alt="C++" class="orbit-icon" style="--i:2;">
      <img src="assets/lang/c.svg" alt="C" class="orbit-icon" style="--i:3;">
      <img src="assets/lang/rust.svg" alt="Rust" class="orbit-icon" style="--i:4;">
      <img src="assets/lang/go.svg" alt="Go" class="orbit-icon" style="--i:5;">
      <img src="assets/lang/dart.svg" alt="Dart" class="orbit-icon" style="--i:6;">
      <img src="assets/lang/haskell.svg" alt="Haskell" class="orbit-icon" style="--i:7;">
      <img src="assets/lang/lua.svg" alt="Lua" class="orbit-icon" style="--i:8;">
    </div>
  </section>

  <section id="s2" aria-label="Section 2">
		<div class="panel proj-panel"></div>
    <div id="prevPage" class="nav-arrow">&#10094;</div>
    <div id="nextPage" class="nav-arrow">&#10095;</div>
  </section>

  <section id="s3" aria-label="Section 3">
    <div class="panel">
    </div>
  </section>

  <section id="s4" aria-label="Section 4">
    <div class="panel">
    </div>
  </section>
</main>

<div class="dots" id="dots" aria-hidden="false"></div>
<div class="meta">Tip: press ↑ ↓ or use the mousewheel / swipe</div>

<script src="js/scroll.js"></script>
<script src="js/type.js"></script>
<script src="js/projects.js"></script>
</body>
</html>
