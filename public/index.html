<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Dark Fullscreen Sections</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/index.css">
</head>
<body>
<main id="viewport" tabindex="0" aria-label="Full screen sections">
  <section id="s1" aria-label="Section 1">
    <div class="panel">
      <h1 class="typewriter" 
	  data-text="Charles Ueltschey"
	  data-speed="50" 
	  data-cursor="|">
      </h1>
    </div>
  </section>

  <section id="s2" aria-label="Section 2">
    <div class="panel">
      <h1>Section Two</h1>
      <p>Use wheel, keyboard arrows, page up/down or swipe to navigate.</p>
    </div>
  </section>

  <section id="s3" aria-label="Section 3">
    <div class="panel">
      <h1>Section Three</h1>
      <p>Thin separator lines between full-screen sections.</p>
    </div>
  </section>

  <section id="s4" aria-label="Section 4">
    <div class="panel">
      <h1>Section Four</h1>
      <p>That's it — add more sections as you like.</p>
    </div>
  </section>
</main>

<div class="dots" id="dots" aria-hidden="false"></div>
<div class="meta">Tip: press ↑ ↓ or use the mousewheel / swipe</div>

<script src="js/scroll.js"></script>
<script>
(function() {
  const el = document.querySelector('.typewriter');
  if (!el) return;

  const text = el.dataset.text || '';
  const speed = parseInt(el.dataset.speed, 10) || 100;
  const cursor = el.dataset.cursor || '|';

  let i = 0;

  function type() {
    if (i < text.length) {
      el.textContent = text.substring(0, i + 1) + cursor;
      i++;
      setTimeout(type, speed);
    } else {
      el.textContent = text; // remove cursor at end
      el.classList.add('blink'); // add blinking border
    }
  }

  el.textContent = '';
  type();
})();
</script>
</body>
</html>
