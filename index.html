<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Force Graph with Detail Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="graph-container" id="graph-container"></div>
  <div id="left-panel"></div>
  <div id="right-panel"></div>

  <script src="https://cdn.jsdelivr.net/npm/force-graph"></script>
  <script>
    const bgCanvas = document.getElementById("bg-canvas");
    const ctx = bgCanvas.getContext("2d");
    let stars = [];
    function resizeCanvas() {
      bgCanvas.width = window.innerWidth;
      bgCanvas.height = window.innerHeight;
      stars = Array.from({length: 200}, () => ({
        x: Math.random() * bgCanvas.width,
        y: Math.random() * bgCanvas.height,
        speed: 0.2 + Math.random() * 1.5,
        radius: Math.random() * 1.5 + 0.5
      }));
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function animateStars() {
      ctx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      ctx.fillStyle = "white";
      for (let star of stars) {
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, 2 * Math.PI);
        ctx.fill();
        star.x += star.speed * 0.5;
        star.y += star.speed * 0.2;

        if (star.x > bgCanvas.width) star.x = 0;
        if (star.y > bgCanvas.height) star.y = 0;
      }
      requestAnimationFrame(animateStars);
    }
    animateStars();

    colorList = {}
    let currentColorIdx = 0;
    let predefinedColors = 

    function randomColorHex() {
      const randomHex = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
      return randomHex;
    }

    function nodePaint(node, ctx, index) {
      if(!colorList[node.type]){
        const newColor = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
        ctx.fillStyle = newColor;
        colorList[node.type] = newColor;
      } else {
        ctx.fillStyle = colorList[node.type]
      }

      // Draw the node based on its type
      [
        () => { ctx.fillRect(node.x - 6, node.y - 4, 12, 8); }, // rectangle
        () => { ctx.beginPath(); ctx.moveTo(node.x, node.y - 5); ctx.lineTo(node.x - 5, node.y + 5); ctx.lineTo(node.x + 5, node.y + 5); ctx.fill(); }, // triangle
        () => { ctx.beginPath(); ctx.arc(node.x, node.y, 5, 0, 2 * Math.PI, false); ctx.fill(); }, // circle
        () => { 
          ctx.beginPath(); ctx.arc(node.x, node.y, 5, 0, 2 * Math.PI, false); ctx.fill();
          ctx.fillStyle = "#ffffff";
          ctx.font = '5px Sans-Serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(node.name, node.x, node.y + 10); 
        } 
      ][index]();

      if (node === focusedNode) {
        ctx.strokeStyle = 'rgba(120, 200, 255, 0.9)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    const data = {
      nodes: [
        { id: 'home', name: 'About Me', type: 'root' },

        { id: 'work', name: 'Work Experience' , type: 'work'},
        { id: 'contact', name: 'Contact' , type: 'work'},
        { id: 'resume', name: 'Resume' , type: 'work'},

        { id: 'projects', name: 'Personal Projects', type: 'link'},
        { id: 'opengl_boids', name: 'Boids Simulation', type: 'proj'},
        { id: 'codebase_analyzer', name: 'Codebase Graph', type: 'proj'},
        { id: 'somepkgmgr', name: 'Debian Package Manager', type: 'proj'},
        { id: 'ofh_compress', name: 'OFH Compression', type: 'proj'},
        { id: 'lfs', name: 'Linux From Scratch', type: 'proj'},
        { id: 'coreutils', name: 'Coreutils Implementation', type: 'proj'},
        { id: 'kbd_driver', name: 'Linux Keyboard Driver', type: 'proj'},
        { id: 'tips', name: 'Tips Interpreter', type: 'proj'},
        { id: 'assembler', name: 'x86_64 Assembler', type: 'proj'},
        { id: 'flutter_abc', name: 'Flutter ABC renderer', type: 'proj'},
        { id: 'squared_away', name: 'Squared Away App', type: 'proj'},
        { id: 'qr_generator', name: 'QR Code Generator', type: 'proj'},
        { id: 'microbe_net', name: 'Microbe Identifier CNN', type: 'proj'},

        { id: 'skills', name: 'My Skills' , type: 'link'},
        { id: 'cprogramming', name: 'C/C++' , type: 'skill'},
        { id: 'python', name: 'Python' , type: 'skill'},
        { id: 'linux', name: 'Linux' , type: 'skill'},
        { id: 'flutter', name: 'Flutter/Dart' , type: 'skill'},
        { id: 'go', name: 'Go' , type: 'skill'},
        { id: 'javascript', name: 'Javascript/Typescript' , type: 'skill'},
        { id: 'ai_ml', name: 'AI/ML Development' , type: 'skill'},

      ],
      links: [
        // Home
        { source: 'home', target: 'projects' },
        { source: 'home', target: 'work' },
        { source: 'home', target: 'skills' },

        // Work
        { source: 'work', target: 'contact' },
        { source: 'work', target: 'resume' },

        // Project
        { source: 'projects', target: 'opengl_boids' },
        { source: 'projects', target: 'codebase_analyzer' },
        { source: 'projects', target: 'somepkgmgr' },
        { source: 'projects', target: 'ofh_compress' },
        { source: 'projects', target: 'lfs' },
        { source: 'projects', target: 'coreutils' },
        { source: 'projects', target: 'kbd_driver' },
        { source: 'projects', target: 'tips' },
        { source: 'projects', target: 'assembler' },
        { source: 'projects', target: 'flutter_abc' },
        { source: 'projects', target: 'squared_away' },
        { source: 'projects', target: 'qr_generator' },
        { source: 'projects', target: 'microbe_net' },


        // Skills
        { source: 'skills', target: 'cprogramming' },
        { source: 'skills', target: 'linux' },
        { source: 'skills', target: 'flutter' },
        { source: 'skills', target: 'go' },
        { source: 'skills', target: 'javascript' },
        { source: 'skills', target: 'ai_ml' },
        { source: 'skills', target: 'python' },

        // Inter category links
        { source: 'go', target: 'somepkgmgr' },
        { source: 'cprogramming', target: 'opengl_boids' },
        { source: 'cprogramming', target: 'ofh_compress' },
        { source: 'cprogramming', target: 'coreutils' },
        { source: 'cprogramming', target: 'kbd_driver' },
        { source: 'cprogramming', target: 'qr_generator' },
        { source: 'cprogramming', target: 'tips' },
        { source: 'flutter', target: 'flutter_abc' },
        { source: 'flutter', target: 'squared_away' },
        { source: 'ai_ml', target: 'microbe_net' },
        { source: 'ai_ml', target: 'ofh_compress' },
        { source: 'linux', target: 'lfs' },
        { source: 'javascript', target: 'codebase_analyzer' },
      ]
    };

    let focusedNode = data.nodes[0];
    loadNodeDetails(focusedNode.id);

    function focusOnNode(node, Graph) {
      Graph.centerAt(node.x, node.y, 1000);
      focusedNode = node
    }


    function loadNodeDetails(nodePage) {
      const leftPanel = document.getElementById('right-panel');
      fetch(`pages/${nodePage}_right.html`)
        .then(res => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.text();
        })
        .then(html => leftPanel.innerHTML = html)
        .catch(err => {
          leftPanel.innerHTML = `<p style="color: #e63946;">Error loading content: ${err.message}</p>`;
        });

      panel = document.getElementById('left-panel');
      fetch(`pages/${nodePage}_left.html`)
        .then(res => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.text();
        })
        .then(html => panel.innerHTML = `<div style="height: 10vh;"></div>${html}`)
        .catch(err => {
          panel.innerHTML = `<p style="color: #e63946;">Error loading content: ${err.message}</p>`;
        });
    }


    const Graph = ForceGraph()(document.getElementById('graph-container'))
      .nodeCanvasObject((node, ctx) => nodePaint(node, ctx, node.type == "link"? 1 : 3))
      .graphData(data)
      .nodeRelSize(12)
      .linkColor(link => {
        if (focusedNode && (link.source === focusedNode || link.target === focusedNode)) {
          return 'rgba(255,255,255,1)';
        }
        return 'rgba(255,255,255,0.4)';
      })
      .onNodeClick(node => {
        if(node.type != "link"){
          loadNodeDetails(node.id);
          focusOnNode(node, Graph)
        }
      });

    Graph.d3Force('charge').strength(-500);
  </script>
</body>
</html>
