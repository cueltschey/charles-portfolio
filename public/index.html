<!doctype html> <html lang="en"> <head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Charles Ueltschey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/index.css">
<link rel="stylesheet" href="css/type.css">
<link rel="stylesheet" href="css/projects.css">
</head>
<body>
<main id="viewport" tabindex="0" aria-label="Full screen sections">
  <section id="s1" aria-label="Section 1">
    <div class="panel">
      <h1 class="typewriter" 
    data-text="Charles Ueltschey"
    data-speed="50" 
    data-cursor="|">
      </h1>
      <p class="subtext" 
    data-speed="75" 
    data-cursor="|">
      </p>
    </div>
  </section>

  <section id="s2" aria-label="Section 2">
    <div class="panel proj-panel"></div>
  </section>

  <section id="s3" aria-label="Section 3">
    <div class="panel">
    </div>
  </section>

  <section id="s4" aria-label="Section 4">
    <div class="panel">
    </div>
  </section>
</main>

<div class="dots" id="dots" aria-hidden="false"></div>
<div class="meta">Tip: press ↑ ↓ or use the mousewheel / swipe</div>

<script src="js/scroll.js"></script>
<script src="js/type.js"></script>
<script>
(function () {
	const projects_json = [
		{ img: "assets/test.png", title: "Test1", desc: "A testing project" },
		{img: "assets/test.png", title: "Test2", desc: "A testing project"},
		{img: "assets/test.png", title: "Test3", desc: "A testing project"},
		{img: "assets/test.png", title: "Test4", desc: "A testing project"},
	]
	const projects_pane = document.querySelector(".proj-panel");
	projects_json.forEach((obj) => {
		if(!obj.img || !obj.title || !obj.desc) return;
		const new_project = document.createElement("div")
		new_project.classList = "project"
		new_project.innerHTML = `<img src="${obj.img}"  class="proj-bg"></img><h1 class="proj-title">${obj.title}</h1><p class="proj-desc">${obj.desc}</p>`
		projects_pane.appendChild(new_project)
	})
})();
</script>
</body>
</html>
